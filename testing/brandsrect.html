<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Brands Carousel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Archivo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --primary-light: #9984d4;
            --primary: #592e83;
            --primary-dark: #450077;
            --dark-amethyst: #150132;
            --font-family: "Archivo", Helvetica, sans-serif;
        }
        
        body {
            font-family: var(--font-family);
            background-color: #fafafa;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brands-section {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .section-title {
            text-align: center;
            color: var(--dark-amethyst);
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 3px;
            background: var(--primary);
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        
        /* Rectangle Carousel Container */
        .rectangle-carousel {
            position: relative;
            padding: 40px 0;
        }
        
        /* Carousel Track */
        .carousel-track-brands {
            display: flex;
            gap: 16px;
            animation: scroll 35s linear infinite;
            width: max-content;
        }
        
        /* Pause animation on hover */
        .carousel-container:hover .carousel-track-brands {
            animation-play-state: paused;
        }
        
        /* Brand Logo Item - Rectangle */
        .brand-logo-item {
            width: 220px;
            height: 120px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-rectangle {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            background: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            padding: 15px;
          }
        
        .logo-rectangle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
          }
          
          .logo-rectangle:hover {
            background: none !important;
        }
        
        .logo-rectangle:hover::before {
            opacity: 1;
        }
        
        /* Logo Image */
        .brand-logo {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.9;
            transition: all 0.4s ease;
        }
        
        .logo-rectangle:hover .brand-logo {
            filter: grayscale(0%);
            opacity: 1;
        }
        
        /* Infinite Scroll Animation */
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-220px * 12 - 30px * 12));
            }
        }
        
        /* Gradient Fade Edges */
        .carousel-container {
            position: relative;
            overflow: hidden;
            padding: 0 40px;
        }
        
        .carousel-container::before,
        .carousel-container::after {
            content: '';
            position: absolute;
            top: 0;
            width: 120px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .carousel-container::before {
            left: 0;
            background: linear-gradient(to right, #fafafa, transparent);
        }
        
        .carousel-container::after {
            right: 0;
            background: linear-gradient(to left, #fafafa, transparent);
        }
        
        /* Navigation Dots */
        .carousel-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
        }
        
        .control-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(153, 132, 212, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-dot.active {
            background: var(--primary);
            transform: scale(1.3);
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .brand-logo-item {
                width: 200px;
                height: 110px;
            }
            
            .logo-rectangle {
                width: 200px;
                height: 110px;
            }
            
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-200px * 12 - 30px * 12)); }
            }
        }
        
        @media (max-width: 992px) {
            .brand-logo-item {
                width: 180px;
                height: 100px;
            }
            
            .logo-rectangle {
                width: 160px;
                height: 80px;
                padding: 0px;
            }

            .carousel-track-brands{
              gap: 8px;
            }
            
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-180px * 12 - 30px * 12)); }
            }
        }
        
        @media (max-width: 768px) {
            .brand-logo-item {
                width: 160px;
                height: 90px;
            }
            
            .logo-rectangle {
                width: 140px;
                height: 70px;
                padding: 0px;
            }
            
            .section-title {
                font-size: 1.7rem;
                margin-bottom: 40px;
            }
            
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-160px * 12 - 30px * 12)); }
            }
            
            .carousel-container {
                padding: 0 20px;
            }
            
            .carousel-container::before,
            .carousel-container::after {
                width: 60px;
            }

            .carousel-track-brands{
              gap: 8px;
            }
        }
        
        @media (max-width: 576px) {
            .brand-logo-item {
                width: 140px;
                height: 80px;
            }
            
            .logo-rectangle {
                width: 120px;
                height: 60px;
            }
            
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-140px * 12 - 30px * 12)); }
            }
        }
        
        /* Instructions */
        .instructions {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-top: 30px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .instructions i {
            color: var(--primary);
        }
        
        /* Hover Label (appears on hover) */
        .hover-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .logo-rectangle:hover .hover-label {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="brands-section">
        <h2 class="section-title">Featured Brands</h2>
        
        <div class="rectangle-carousel">
            <div class="carousel-container">
                <div class="carousel-track-brands">
                    <!-- Brand items will be generated by JavaScript -->
                </div>
            </div>
            
            <div class="carousel-controls" id="carouselControls">
                <!-- Dots will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="instructions">
            <i class="fas fa-hand-point-up"></i>
            <span>Hover to pause & see color • Click dots to jump</span>
        </div>
    </div>

    <script>
        // Brand data - Using placehold.co with your color scheme
        const brands = [
            { id: 1, name: "TechCorp", color1: "450077", color2: "9984d4" },
            { id: 2, name: "StyleHub", color1: "450077", color2: "9984d4" },
            { id: 3, name: "AutoDrive", color1: "450077", color2: "9984d4" },
            { id: 4, name: "Foodie", color1: "450077", color2: "9984d4" },
            { id: 5, name: "HomeEssentials", color1: "450077", color2: "9984d4" },
            { id: 6, name: "SportPro", color1: "450077", color2: "9984d4" },
            { id: 7, name: "BeautyLuxe", color1: "450077", color2: "9984d4" },
            { id: 8, name: "GadgetZone", color1: "450077", color2: "9984d4" },
            { id: 9, name: "EcoLife", color1: "450077", color2: "9984d4" },
            { id: 10, name: "SmartHome", color1: "450077", color2: "9984d4" },
            { id: 11, name: "Fashionista", color1: "450077", color2: "9984d4" },
            { id: 12, name: "HealthPlus", color1: "450077", color2: "9984d4" }
        ];
        
        // Initialize carousel
        function initCarousel() {
            const carouselTrack = document.querySelector('.carousel-track-brands');
            
            // Clear existing content
            carouselTrack.innerHTML = '';
            
            // Create two sets for seamless scrolling
            const totalSets = 2;
            
            for (let set = 0; set < totalSets; set++) {
                brands.forEach((brand, index) => {
                    // Create brand item
                    const brandItem = document.createElement('div');
                    brandItem.className = 'brand-logo-item';
                    brandItem.dataset.index = index;
                    
                    // Create rectangle container
                    const rectangle = document.createElement('div');
                    rectangle.className = 'logo-rectangle';
                    
                    // Create image (using placehold.co)
                    const img = document.createElement('img');
                    img.className = 'brand-logo';
                    // Using 200x100 size for placeholder (matches rectangle size)
                    img.src = `https://placehold.co/220x120/${brand.color1}/${brand.color2}`;
                    img.alt = brand.name;
                    img.loading = 'lazy';
                    
                    // Create hover label
                    const label = document.createElement('div');
                    label.className = 'hover-label';
                    label.textContent = brand.name;
                    
                    // Assemble
                    rectangle.appendChild(img);
                    rectangle.appendChild(label);
                    brandItem.appendChild(rectangle);
                    carouselTrack.appendChild(brandItem);
                    
                    // Add click event to logo
                    rectangle.addEventListener('click', function() {
                        alert(`Clicked on ${brand.name}`);
                    });
                });
            }
            
            // Setup hover pause functionality
            setupHoverPause();
        }
        
        // Jump to specific brand
        function jumpToBrand(index) {
            const track = document.querySelector('.carousel-track-brands');
            const itemWidth = 220; // Should match CSS width + gap
            const offset = -(index * itemWidth);
            
            // Pause animation temporarily
            track.style.animationPlayState = 'paused';
            track.style.transform = `translateX(${offset}px)`;
            
            // Resume animation after 3 seconds
            setTimeout(() => {
                track.style.animationPlayState = 'running';
            }, 3000);
        }
        
        // Setup hover pause functionality
        function setupHoverPause() {
            const track = document.querySelector('.carousel-track-brands');
            const container = document.querySelector('.carousel-container');
            
            // Pause on container hover
            container.addEventListener('mouseenter', () => {
                track.style.animationPlayState = 'paused';
            });
            
            container.addEventListener('mouseleave', () => {
                track.style.animationPlayState = 'running';
            });
            
            // Individual logo hover effects
            document.querySelectorAll('.logo-rectangle').forEach(logo => {
                logo.addEventListener('mouseenter', function() {
                    // Add pulsing effect
                    this.style.animation = 'pulse 2s infinite';
                });
                
                logo.addEventListener('mouseleave', function() {
                    this.style.animation = '';
                });
            });
        }
        
        // Add CSS for pulsing effect
        const style = document.createElement('style');
        style.textContent = `
        `;
        document.head.appendChild(style);
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', initCarousel);
        
        // Handle window resize
        window.addEventListener('resize', function() {
            // Adjust animation speed based on screen width
            const track = document.querySelector('.carousel-track-brands');
            if (track) {
                // Restart animation to apply new keyframes
                track.style.animation = 'none';
                setTimeout(() => {
                    track.style.animation = 'scroll 35s linear infinite';
                    track.style.animationPlayState = 'running';
                }, 10);
            }
        });
    </script>
</body>
</html>
