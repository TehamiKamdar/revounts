<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Logos Carousel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Archivo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --primary-light: #9984d4;
            --primary: #592e83;
            --primary-dark: #450077;
            --dark-amethyst: #150132;
            --font-family: "Archivo", Helvetica, sans-serif;
        }
        
        body {
            font-family: var(--font-family);
            background-color: #fefefe;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brands-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            text-align: center;
            color: var(--dark-amethyst);
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Minimal Carousel Container */
        .minimal-carousel {
            position: relative;
            padding: 30px 0;
        }
        
        /* Carousel Track */
        .carousel-track {
            display: flex;
            gap: 40px;
            animation: scroll 40s linear infinite;
            width: max-content;
        }
        
        /* Pause animation on hover */
        .carousel-container:hover .carousel-track {
            animation-play-state: paused;
        }
        
        /* Brand Logo Item */
        .brand-logo-item {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
            border: 1px solid rgba(153, 132, 212, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .logo-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(153, 132, 212, 0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .logo-circle:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 25px rgba(89, 46, 131, 0.1);
            border-color: rgba(153, 132, 212, 0.3);
        }
        
        .logo-circle:hover::before {
            opacity: 1;
        }
        
        /* Logo Image */
        .brand-logo {
            max-width: 70%;
            max-height: 70%;
            filter: grayscale(100%);
            opacity: 0.8;
            transition: all 0.4s ease;
        }
        
        .logo-circle:hover .brand-logo {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.05);
        }
        
        /* Infinite Scroll Animation */
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-140px * 8 - 40px * 8));
            }
        }
        
        /* Gradient Fade Edges */
        .carousel-container {
            position: relative;
            overflow: hidden;
        }
        
        .carousel-container::before,
        .carousel-container::after {
            content: '';
            position: absolute;
            top: 0;
            width: 120px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .carousel-container::before {
            left: 0;
            background: linear-gradient(to right, #fefefe, transparent);
        }
        
        .carousel-container::after {
            right: 0;
            background: linear-gradient(to left, #fefefe, transparent);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .brand-logo-item {
                width: 120px;
                height: 120px;
            }
            
            .logo-circle {
                width: 100px;
                height: 100px;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(calc(-120px * 8 - 40px * 8));
                }
            }
        }
        
        @media (max-width: 576px) {
            .brand-logo-item {
                width: 100px;
                height: 100px;
            }
            
            .logo-circle {
                width: 85px;
                height: 85px;
            }
            
            .section-title {
                font-size: 1.5rem;
                margin-bottom: 40px;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(calc(-100px * 8 - 40px * 8));
                }
            }
        }
        
        /* Instructions */
        .instructions {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-top: 30px;
            font-weight: 400;
        }
        
        .instructions i {
            color: var(--primary-light);
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="brands-section">
        <h2 class="section-title">Trusted Brands</h2>
        
        <div class="minimal-carousel">
            <div class="carousel-container">
                <div class="carousel-track">
                    <!-- Brand 1 -->
                    <div class="brand-logo-item">

                            <img src="https://cdn.worldvectorlogo.com/logos/apple-1.svg" alt="Apple" class="brand-logo">

                    </div>
                    
                    <!-- Brand 3 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">

                        </div>
                    </div>
                    
                    <!-- Brand 4 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/adidas-2.svg" alt="Adidas" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 5 -->
                    <div class="brand-logo-item">

                            <img src="https://cdn.worldvectorlogo.com/logos/sony-6.svg" alt="Sony" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 6 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/microsoft-5.svg" alt="Microsoft" class="brand-logo">
                        </div>

                    <!-- Brand 7 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/amazon-icon-1.svg" alt="Amazon" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 8 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/google-2015.svg" alt="Google" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Duplicate for seamless loop -->
                    <!-- Brand 1 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/apple-1.svg" alt="Apple" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 2 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/nike-4.svg" alt="Nike" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 3 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/samsung-2.svg" alt="Samsung" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 4 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/adidas-2.svg" alt="Adidas" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 5 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/sony-6.svg" alt="Sony" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 6 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/microsoft-5.svg" alt="Microsoft" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 7 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/amazon-icon-1.svg" alt="Amazon" class="brand-logo">
                        </div>
                    </div>
                    
                    <!-- Brand 8 -->
                    <div class="brand-logo-item">
                        <div class="logo-circle">
                            <img src="https://cdn.worldvectorlogo.com/logos/google-2015.svg" alt="Google" class="brand-logo">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <i class="fas fa-hand-point-up"></i> Hover over logos to pause and see color
        </div>
    </div>

    <script>
        // Simple hover effect with pause
        document.querySelectorAll('.logo-circle').forEach(circle => {
            circle.addEventListener('mouseenter', function() {
                // Add a subtle pulsing effect
                this.style.animation = 'pulse 2s infinite';
            });
            
            circle.addEventListener('mouseleave', function() {
                // Remove pulsing effect
                this.style.animation = '';
            });
        });
        
        // Add CSS for pulsing effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { box-shadow: 0 10px 25px rgba(89, 46, 131, 0.1); }
                50% { box-shadow: 0 10px 25px rgba(89, 46, 131, 0.2); }
                100% { box-shadow: 0 10px 25px rgba(89, 46, 131, 0.1); }
            }
        `;
        document.head.appendChild(style);
        
        // Pause animation when hovering over any logo
        document.querySelectorAll('.logo-circle').forEach(logo => {
            logo.addEventListener('mouseenter', () => {
                document.querySelector('.carousel-track').style.animationPlayState = 'paused';
            });
            
            logo.addEventListener('mouseleave', () => {
                document.querySelector('.carousel-track').style.animationPlayState = 'running';
            });
        });
    </script>
</body>
</html>
