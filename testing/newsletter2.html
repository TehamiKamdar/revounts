<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Newsletter</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Archivo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --font-family: "Archivo", Helvetica, sans-serif;
            --gradient-start: #f262ff;
            --gradient-end: #7a43d3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: #f8f9fa;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .newsletter-section {
            width: 100%;
            max-width: 1000px;
            height: 230px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(122, 67, 211, 0.25);
        }

        /* Background Elements */
        .newsletter-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bg-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .dot-1 { top: 30%; left: 10%; }
        .dot-2 { top: 60%; left: 15%; }
        .dot-3 { top: 20%; right: 20%; }
        .dot-4 { bottom: 25%; right: 10%; }

        /* Content */
        .newsletter-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            color: white;
            position: relative;
            z-index: 2;
        }

        .text-content {
            flex: 1;
            max-width: 500px;
        }

        .newsletter-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .newsletter-subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        /* Email Form */
        .email-form {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 400px;
        }

        .email-input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            font-family: var(--font-family);
            font-size: 0.95rem;
            color: #333;
            transition: all 0.3s ease;
        }

        .email-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .email-input::placeholder {
            color: #999;
        }

        .subscribe-btn {
            background: white;
            color: var(--gradient-end);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .subscribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background: #f8f9fa;
        }

        /* Message */
        .subscription-message {
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .subscription-message.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .newsletter-section {
                height: auto;
                min-height: 230px;
                flex-direction: column;
                padding: 40px 30px;
                text-align: center;
            }

            .newsletter-content {
                flex-direction: column;
                gap: 30px;
            }

            .text-content {
                text-align: center;
            }

            .email-form {
                width: 100%;
                max-width: 500px;
            }
        }

        @media (max-width: 576px) {
            .newsletter-section {
                padding: 30px 20px;
            }

            .newsletter-title {
                font-size: 1.5rem;
            }

            .email-form {
                flex-direction: column;
                gap: 12px;
            }

            .email-input,
            .subscribe-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="newsletter-section">
        <!-- Background Dots -->
        <div class="newsletter-bg">
            <div class="bg-dot dot-1"></div>
            <div class="bg-dot dot-2"></div>
            <div class="bg-dot dot-3"></div>
            <div class="bg-dot dot-4"></div>
        </div>

        <!-- Content -->
        <div class="newsletter-content">
            <!-- Left Text -->
            <div class="text-content">
                <h3 class="newsletter-title">Get Exclusive Coupons</h3>
                <p class="newsletter-subtitle">
                    Subscribe to get weekly coupon codes and special offers directly in your inbox.
                </p>
            </div>

            <!-- Right Email Form -->
            <form class="email-form" id="simpleNewsletter">
                <input type="email" class="email-input" placeholder="Enter your email address" required>
                <button type="submit" class="subscribe-btn">
                    <i class="fas fa-paper-plane"></i>
                    <span>Subscribe</span>
                </button>
            </form>
        </div>

        <!-- Subscription Message (Initially Hidden) -->
        <div class="subscription-message" id="subMessage">
            <i class="fas fa-check-circle"></i>
            <span>Thank you for subscribing! Check your email for confirmation.</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const newsletterForm = document.getElementById('simpleNewsletter');
            const emailInput = newsletterForm.querySelector('.email-input');
            const subscribeBtn = newsletterForm.querySelector('.subscribe-btn');
            const messageElement = document.getElementById('subMessage');

            newsletterForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();

                // Simple email validation
                if (!email.includes('@') || !email.includes('.')) {
                    // Visual feedback for invalid email
                    emailInput.style.boxShadow = '0 0 0 3px rgba(255, 71, 87, 0.3)';
                    setTimeout(() => {
                        emailInput.style.boxShadow = '';
                    }, 1000);
                    return;
                }

                // Show loading state
                const originalText = subscribeBtn.innerHTML;
                subscribeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Subscribing...</span>';
                subscribeBtn.disabled = true;

                // Simulate API call
                setTimeout(() => {
                    // Show success message
                    messageElement.classList.add('show');

                    // Reset form
                    emailInput.value = '';
                    subscribeBtn.innerHTML = originalText;
                    subscribeBtn.disabled = false;

                    // Hide message after 5 seconds
                    setTimeout(() => {
                        messageElement.classList.remove('show');
                    }, 5000);

                    // Add animation to button
                    subscribeBtn.style.background = '#27ae60';
                    subscribeBtn.style.color = 'white';
                    setTimeout(() => {
                        subscribeBtn.style.background = '';
                        subscribeBtn.style.color = '';
                    }, 2000);

                }, 1000);
            });

            // Input focus effect
            emailInput.addEventListener('focus', function() {
                this.style.transform = 'translateY(-1px)';
            });

            emailInput.addEventListener('blur', function() {
                this.style.transform = '';
            });

            // Add subtle animation to dots
            const dots = document.querySelectorAll('.bg-dot');
            dots.forEach((dot, index) => {
                dot.style.animation = `float ${3 + index}s infinite ease-in-out`;
            });

            // Add float animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0%, 100% {
                        transform: translateY(0);
                    }
                    50% {
                        transform: translateY(-10px);
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
