<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Section</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Owl Carousel -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo&family=Aleo&display=swap" rel="stylesheet">

    <style>
        :root {
            --white: #ffffff;
            --primary-light: #9e62ff;
            --primary: #592e83;
            --primary-dark: #450077;
            --dark-amethyst: #150132;
        }

        body {
            background: var(--dark-amethyst);
            font-family: "Archivo", sans-serif;
        }

        .shop-section {
            padding: 60px 0;
        }

        /* ACCORDION */
        .accordion-item {
            background: transparent;
            border: none;
            margin-bottom: 20px;
        }

        .accordion-button {
            background: var(--primary-dark);
            color: var(--white);
            font-family: "Aleo", serif;
            font-size: 20px;
            border-radius: 14px !important;
        }

        .accordion-button:not(.collapsed) {
            background: var(--primary);
            color: var(--white);
        }

        .accordion-button::after {
            filter: invert(1);
        }

        .accordion-body {
            background: var(--dark-amethyst);
            padding: 25px;
            border-radius: 0 0 14px 14px;
        }

        /* CARD 150x75 (GLOBAL) */
        .card-150 {
            width: 150px;
            height: 75px;
            background: var(--white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .3s;
            text-decoration: none;
        }

        .card-150 img {
            width: 150px;
            height: 75px;
            border-radius: 10px;
        }

        .card-150:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,.3);
        }

        /* CATEGORY VERTICAL */
        .category-row {
            background: var(--primary-dark);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .category-title {
            min-width: 180px;
            color: var(--white);
            font-family: "Aleo", serif;
            font-size: 16px;
        }

        .owl-carousel .item {
            display: flex;
            justify-content: center;
        }

        .category-carousel{
            overflow: hidden;
        }
    </style>
</head>
<body>

<section class="shop-section">
    <div class="container">

        <div class="accordion" id="shopAccordion">

            <!-- SHOP BY BRANDS -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#brands" aria-expanded="true">
                        Shop by Brands
                    </button>
                </h2>

                <div id="brands" class="accordion-collapse collapse show" data-bs-parent="#shopAccordion">
                    <div class="accordion-body">

                        <div class="owl-carousel brand-carousel">
                            <div class="item">
                                <a href="#" class="card-150">
                                    <img src="https://placehold.co/150x75">
                                </a>
                            </div>
                            <div class="item">
                                <a href="#" class="card-150">
                                    <img src="https://placehold.co/150x75">
                                </a>
                            </div>
                            <div class="item">
                                <a href="#" class="card-150">
                                    <img src="https://placehold.co/150x75">
                                </a>
                            </div>
                            <div class="item">
                                <a href="#" class="card-150">
                                    <img src="https://placehold.co/150x75">
                                </a>
                            </div>
                            <div class="item">
                                <a href="#" class="card-150">
                                    <img src="https://placehold.co/150x75">
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- SHOP BY CATEGORY -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#categories">
                        Shop by Category
                    </button>
                </h2>

                <div id="categories" class="accordion-collapse collapse" data-bs-parent="#shopAccordion">
                    <div class="accordion-body">

                        <!-- CATEGORY 1 -->
                        <div class="category-row mb-3">
                            <div class="category-title">Fashion</div>

                            <div class="owl-carousel category-carousel flex-grow-1">
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- CATEGORY 2 -->
                        <div class="category-row">
                            <div class="category-title">Electronics</div>

                            <div class="owl-carousel category-carousel flex-grow-1">
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                                <div class="item">
                                    <a href="#" class="card-150">
                                        <img src="https://placehold.co/150x75">
                                    </a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>
</section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

<script>
    $('.brand-carousel').owlCarousel({
        loop: true,
        margin: 10,
        dots: false,
        autoplay: true,          // autoplay ON / OFF
        autoplayTimeout: 2000,   // time (ms) between slides
        autoplayHoverPause: true, // hover pe pause
        autoplaySpeed: 800,     // slide transition speed
        nav: false,
        responsive: {
            0: { items: 3 },
            576: { items: 4 },
            992: { items: 6 }
        }
    });

    $('.category-carousel').owlCarousel({
        loop: true,
        margin: 10,
        dots: false,
        autoplay: true,          // autoplay ON / OFF
        autoplayTimeout: 2000,   // time (ms) between slides
        autoplayHoverPause: true, // hover pe pause
        autoplaySpeed: 800,     // slide transition speed
        nav: false,
        responsive: {
            0: { items: 4 },
            768: { items: 6 }
        }
    });
</script>

</body>
</html>
